<div class="profile">
  <img class="profile-img" src="{{img}}" data-action="editImage" data-edit="img" data-tooltip="{{name}}" />
</div>
<section class="header-details flexrow">
  <h1 class="charname">
    <input
      name="name"
      type="text"
      value="{{name}}"
      placeholder="{{localize 'OSE.Name'}}"
    />
  </h1>
  {{#if isOwnerOrObserver}}
    <ul class="summary flexrow">
      <li class="flex2 flexrow check-field">
        <div>
          <input
            type="text"
            name="system.details.alignment"
            value="{{system.details.alignment}}"
          />
          <label>{{localize 'OSE.details.alignment'}}</label>
        </div>
        <div
          class="check reaction-check"
          data-tooltip="OSE.roll.reaction"
        >
          <a data-action="rollReaction"><i class="fas fa-dice"></i></a>
        </div>
      </li>
      <li class="flexrow check-field" data-check="dungeon">
        <div>
          <input
            type="text"
            name="system.details.appearing.d"
            value="{{system.details.appearing.d}}"
            data-tooltip="{{localize 'OSE.roll.appearing' type=(localize 'OSE.roll.appearingDungeon')}}"
          />
          <label>{{localize 'OSE.details.appearing'}}</label>
        </div>
        <div
          class="check appearing-check"
          data-tooltip="{{localize 'OSE.roll.appearingRoll' type=(localize 'OSE.roll.appearingDungeon')}}"
        >
          <a data-action="rollAppearing"><i class="fas fa-dice"></i></a>
        </div>
      </li>
      <li class="flexrow check-field" data-check="wilderness">
        (
        <div>
          <input
            type="text"
            name="system.details.appearing.w"
            value="{{system.details.appearing.w}}"
            data-tooltip="{{localize 'OSE.roll.appearing' type=(localize 'OSE.roll.appearingWilderness')}}"
          />
        </div>
        )
        <div
          class="check appearing-check"
          data-tooltip="{{localize 'OSE.roll.appearingRoll' type=(localize 'OSE.roll.appearingWilderness')}}"
        >
          <a data-action="rollAppearing"><i class="fas fa-dice"></i></a>
        </div>
      </li>
      {{#if config.morale}}
      <li class="flexrow check-field">
        <div>
          <input
            type="text"
            name="system.details.morale"
            value="{{system.details.morale}}"
          />
          <label>{{localize 'OSE.details.morale'}}</label>
        </div>
        <div class="check morale-check" data-tooltip="OSE.roll.morale">
           <a data-action="rollMorale"><i class="fas fa-dice"></i></a>
        </div>
      </li>
      {{/if}}
    </ul>
    <ul class="summary flexrow">
      <li>
        <input
          type="text"
          name="system.details.xp"
          value="{{system.details.xp}}"
        />
        <label>{{localize 'OSE.details.experience.award'}}</label>
      </li>
      <li>
        <input
          type="text"
          name="system.details.specialAbilities"
          value="{{system.details.specialAbilities}}"
        />
        <label data-tooltip="Special Abilities"
          >{{localize 'OSE.details.special.abilities'}}</label>
      </li>
      <li class="treasure-table {{#if treasureLink}}linked{{/if}} {{#if system.details.treasure.type}}typed{{/if}} {{#if treasureMany}}many{{/if}}" data-tooltip="OSE.details.treasure">
        <div class="treasure-value">
          {{#if treasureLink}}<div class="treasure-links">{{{treasureLink}}}</div>{{/if}}
          <input type="text" name="system.details.treasure.type" value="{{system.details.treasure.type}}" />
        </div>
        <label>{{localize 'OSE.details.treasure'}}</label>
      </li>
    </ul>
  {{/if}}
</section>
