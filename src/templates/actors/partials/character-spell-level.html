  <div data-action="toggleCategory" class="item-category-title flexrow">
    <div class="category-caret"><i class="fas fa-caret-down"></i></div>
    <div class="category-name">{{localize "OSE.spells.Level"}} {{lvl}}</div>
    <div class="field-short">{{localize 'OSE.spells.Slots'}}</div>
    <div class="field-long flexrow">
      <input
        type="text"
        value="{{used}}"
        data-dtype="Number"
        placeholder="0"
        readonly
        data-tooltip="OSE.spells.MemorizedSlotsHint"
      />/<input
        type="text"
        value="{{max}}"
        {{#if maxEditable}}name="system.spells.{{lvl}}.max"{{else}}disabled{{/if}}
        data-dtype="Number"
        placeholder="0"
        data-tooltip="OSE.spells.MaximumSlotsHint"
      />
    </div>
    {{#if @root.owner}}
    <div class="item-controls">
      <a
        class="item-control item-create" data-action="createItem"
        data-type="spell"
        data-lvl="{{lvl}}"
        data-tooltip="OSE.Add"
        ><i class="fa fa-plus"></i
      ></a>
    </div>
    {{/if}}
  </div>
  <ol class="item-list">
    {{#each spells as |item|}}
    <li class="item-entry item draggable" data-item-id="{{item.id}}">
      <div class="item-header flexrow item-rollable">
        <div
          class="item-image" data-action="rollItem"
          style="background-image: url({{item.img}})"
        ></div>
        <h4 class="item-name" data-action="toggleSummary" data-tooltip="{{item.name}}">{{item.name~}}</h4>
        <div class="field-long memorize flexrow">
          <input
            type="text"
            value="{{system.cast}}"
            data-dtype="Number"
            placeholder="0"
            data-field="cast"
            data-tooltip="OSE.spells.Cast"
          />
          /
          <input
            type="text"
            value="{{system.memorized}}"
            data-field="memorize"
            data-dtype="Number"
            placeholder="0"
            data-tooltip="OSE.spells.Memorized"
          />
        </div>
        {{#if @root.owner}}
        <div class="item-controls">
          <a class="item-control item-show" data-action="showItem" data-tooltip="OSE.Show"
            ><i class="fas fa-eye"></i
          ></a>
          <a class="item-control item-edit" data-action="editItem" data-tooltip="OSE.Edit"
            ><i class="fas fa-edit"></i
          ></a>
          <a class="item-control item-delete" data-action="deleteItem" data-tooltip="OSE.Delete"
            ><i class="fas fa-trash"></i
          ></a>
        </div>
        {{/if}}
      </div>
      <div class="item-summary{{#if item.isExpanded}} expanded{{/if}}">
        {{> (path "/templates/actors/partials/actor-item-summary.html")
        item=item}}
      </div>
    </li>
    {{/each}}
  </ol>
