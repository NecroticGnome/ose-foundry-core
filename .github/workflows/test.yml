name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js version 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check types package version
        run: |
          npm run build:types
          v=$(node -p "require('./packages/types/package.json').version")
          dir=$(mktemp -d)
          if npm pack "@ose-foundry-core/types@$v" --pack-destination "$dir" >/dev/null 2>&1; then
            tar -xzf "$dir"/*.tgz -C "$dir"
            cmp -s "$dir/package/index.d.ts" packages/types/index.d.ts ||
              echo "::warning file=packages/types/package.json::Types changed since $v was published. Bump the version in packages/types/package.json."
          fi
